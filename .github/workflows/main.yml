name: Deploy to GitHub Pages

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 设置 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'  # 使用 pnpm 缓存
          cache-dependency-path: 'landada-frontend/pnpm-lock.yaml'  # 关键配置
          working-directory: ./landada-frontend  # 切换目录

      - name: Install dependencies and build
        working-directory: ./landada-frontend
        run: |
          pnpm install
          pnpm run build

      - name: Verify build output
        working-directory: ./landada-frontend
        run: ls -la dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./landada-frontend/dist
